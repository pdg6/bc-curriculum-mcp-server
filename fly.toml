# fly.toml app configuration file generated for bc-curriculum-mcp on 2026-03-21T10:58:13-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bc-curriculum-mcp'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/bc-curriculum.sqlite'
  PORT = '3000'
  TRANSPORT = 'http'

[[mounts]]
  source = 'bc_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
